<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>مشغل الفيديو</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    #player-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!--
    ⚠️ ما نحطش sandbox هنا: المصدر إلي عندك يكتشفه ويرفض يشتغل.
    بدلاً منه: البروكسي (/api/proxy) يخلي المحتوى نفس المصدر (same-origin)
    مع صفحتنا، وهذا يخلينا نراقب أي تنقل غريب من الصفحة الأم ونوقفه.
  -->
  <iframe
    id="player-frame"
    src=""
    allow="autoplay; fullscreen; encrypted-media"
    allowfullscreen
  ></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sourceUrl = params.get('src');
    const frame = document.getElementById('player-frame');

    // يبني رابط البروكسي أوتوماتيكياً من أي رابط خام يوصل
    function buildProxyUrl(raw) {
      if (!raw) return '';
      if (raw.indexOf('/api/proxy') !== -1) return raw; // إذا وصل جاهز مسبقاً
      return '/api/proxy?url=' + encodeURIComponent(raw);
    }

    const proxiedSrc = buildProxyUrl(sourceUrl);
    if (proxiedSrc) {
      frame.src = proxiedSrc;
    }

    // ============================================================
    // 🛡️ Watchdog: يراقب عنوان الـ iframe كل نص ثانية
    // إذا خرج عن نطاق /api/proxy تاعنا (يعني حاول يهرب/يعيد التوجيه)
    // يرجعه فوراً للمصدر الأصلي قبل ما يكمل التنقل
    // ============================================================
    let watchdog = setInterval(function () {
      try {
        const innerHref = frame.contentWindow.location.href;
        if (
          innerHref &&
          innerHref.indexOf('/api/proxy') === -1 &&
          innerHref !== 'about:blank'
        ) {
          console.warn('🛡️ تم رصد محاولة تنقل مشبوهة، جاري الاسترجاع...');
          frame.src = proxiedSrc;
        }
      } catch (e) {
        // تجاهل أي خطأ عرضي وكمّل المراقبة
      }
    }, 500);

    window.addEventListener('beforeunload', function () {
      clearInterval(watchdog);
    });
  </script>

</body>
</html>
